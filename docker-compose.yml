services:

  nginx:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - fraud-net
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus:   "0.05"
          memory: 20M
    restart: unless-stopped

  api-1:
    image: nathanfabio/fraud-detector3:latest
    environment:
      - PORT=8080
      - SEARCH_URL=http://search:8081
    volumes:
      - ./resources:/app/resources:ro
    networks:
      - fraud-net
    depends_on:
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus:   "0.20"
          memory: 55M
    restart: unless-stopped

  api-2:
    image: nathanfabio/fraud-detector3:latest
    environment:
      - PORT=8080
      - SEARCH_URL=http://search:8081
    volumes:
      - ./resources:/app/resources:ro
    networks:
      - fraud-net
    depends_on:
      search:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus:   "0.20"
          memory: 55M
    restart: unless-stopped

  search:
    image: nathanfabio/vector-search2:latest
    environment:
      - PORT=8081
      - REFERENCES_PATH=/app/resources/references.json.gz
    volumes:
      - ./resources:/app/resources:ro
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus:   "0.55"
          memory: 220M
    restart: unless-stopped

networks:
  fraud-net:
    driver: bridge