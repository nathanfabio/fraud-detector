services:
  lb:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - app-net
    mem_limit: 30m
    cpus: "0.2"

  api1:
    image: nathanfabio/fraud-detector4:c403b60
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
    networks:
      - app-net
    mem_limit: 160m
    cpus: "0.4"

  api2:
    image: nathanfabio/fraud-detector4:c403b60
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
    networks:
      - app-net
    mem_limit: 160m
    cpus: "0.4"

networks:
  app-net:
    driver: bridge
