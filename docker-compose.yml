services:
  lb:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - app-net
    mem_limit: 16m
    cpus: "0.05"

  api1:
    image: nathanfabio/fraud-detector4:v12
    command: ["./server"]
    hostname: api1
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
    networks:
      - app-net
    mem_limit: 167m
    cpus: "0.475"

  api2:
    image: nathanfabio/fraud-detector4:v12
    command: ["./server"]
    hostname: api2
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
    networks:
      - app-net
    mem_limit: 167m
    cpus: "0.475"

networks:
  app-net:
    driver: bridge
