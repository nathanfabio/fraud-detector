services:

  nginx:
    image: nathanfabio/fraud-nginx:latest
    ports:
      - "9999:9999"
    networks:
      - fraud-net
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus:   "0.05"
          memory: 20M
    restart: unless-stopped

  api-1:
    image: nathanfabio/fraud-detector3:latest
    environment:
      - PORT=8080
      - SEARCH_URL=http://search:8081
    networks:
      - fraud-net
    depends_on:
      - search
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus:   "0.20"
          memory: 55M
    restart: unless-stopped

  api-2:
    image: nathanfabio/fraud-detector3:latest
    environment:
      - PORT=8080
      - SEARCH_URL=http://search:8081
    networks:
      - fraud-net
    depends_on:
      - search
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s
    deploy:
      resources:
        limits:
          cpus:   "0.20"
          memory: 55M
    restart: unless-stopped

  search:
    image: nathanfabio/vector-search2:latest
    environment:
      - PORT=8081
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus:   "0.55"
          memory: 220M
    restart: unless-stopped

networks:
  fraud-net:
    driver: bridge