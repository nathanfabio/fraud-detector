services:
  lb:
    image: nathanfabio/fraud-detector4:v15
    command: ["./lb"]
    ports:
      - "9999:80"
    volumes:
      - sock-vol:/run/sock:rw
    depends_on:
      - api1
      - api2
    networks:
      - app-net
    mem_limit: 8m
    cpus: "0.05"
    environment:
      - GOGC=off

  api1:
    image: nathanfabio/fraud-detector4:v15
    command: ["./server"]
    hostname: api1
    volumes:
      - sock-vol:/run/sock:rw
    environment:
      - GOGC=off
    networks:
      - app-net
    mem_limit: 170m
    cpus: "0.475"

  api2:
    image: nathanfabio/fraud-detector4:v15
    command: ["./server"]
    hostname: api2
    volumes:
      - sock-vol:/run/sock:rw
    environment:
      - GOGC=off
    networks:
      - app-net
    mem_limit: 170m
    cpus: "0.475"

volumes:
  sock-vol:

networks:
  app-net:
    driver: bridge
