services:
  lb:
    image: nathanfabio/fraud-detector4:v18
    command: ["./lb", "9999", "/run/sock/api1.sock", "/run/sock/api2.sock"]
    ports:
      - "9999:9999"
    volumes:
      - sock-vol:/run/sock:rw
    depends_on:
      - api1
      - api2
    networks:
      - app-net
    mem_limit: 8m
    cpus: "0.05"
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535

  api1:
    image: nathanfabio/fraud-detector4:v18
    command: ["./server"]
    hostname: api1
    volumes:
      - sock-vol:/run/sock:rw
    networks:
      - app-net
    mem_limit: 170m
    cpus: "0.475"
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535

  api2:
    image: nathanfabio/fraud-detector4:v18
    command: ["./server"]
    hostname: api2
    volumes:
      - sock-vol:/run/sock:rw
    networks:
      - app-net
    mem_limit: 170m
    cpus: "0.475"
    ulimits:
      memlock: -1
      nofile:
        soft: 65535
        hard: 65535

volumes:
  sock-vol:

networks:
  app-net:
    driver: bridge
