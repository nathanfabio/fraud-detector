services:

  nginx:
    image: nathanfabio/fraud-nginx:latest
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: 20M
    restart: unless-stopped

  api-1:
    image: nathanfabio/fraud-detector3:latest
    environment:
      - PORT=8080
      - SEARCH_URL=http://search:8081
    depends_on:
      search:
        condition: service_healthy
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 55M
    restart: unless-stopped

  api-2:
    image: nathanfabio/fraud-detector3:latest
    environment:
      - PORT=8080
      - SEARCH_URL=http://search:8081
    depends_on:
      search:
        condition: service_healthy
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 55M
    restart: unless-stopped

  search:
    image: nathanfabio/vector-search2:latest
    environment:
      - PORT=8081
    networks:
      - fraud-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/ready"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.55'
          memory: 220M
    restart: unless-stopped

networks:
  fraud-net:
    driver: bridge