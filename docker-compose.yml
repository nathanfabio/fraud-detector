services:
  lb:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - app-net
    mem_limit: 32m
    cpus: "0.1"

  api1:
    image: nathanfabio/fraud-detector4:latest
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
      - GOGC=off
      - GOMAXPROCS=1
    networks:
      - app-net
    mem_limit: 159m
    cpus: "0.45"

  api2:
    image: nathanfabio/fraud-detector4:latest
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
      - GOGC=off
      - GOMAXPROCS=1
    networks:
      - app-net
    mem_limit: 159m
    cpus: "0.45"

networks:
  app-net:
    driver: bridge
