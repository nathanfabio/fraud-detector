services:
  lb:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 10M

  api1:
    image: nathanfabio/fraud-detector2:latest
    environment:
      - VECTOR_SEARCH_URL=http://vector-search:8080
    depends_on:
      - vector-search
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 50M

  api2:
    image: nathanfabio/fraud-detector2:latest
    environment:
      - VECTOR_SEARCH_URL=http://vector-search:8080
    depends_on:
      - vector-search
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 50M

  vector-search:
    image: nathanfabio/vector-search:latest
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 220M

networks:
  fraud-net:
    driver: bridge