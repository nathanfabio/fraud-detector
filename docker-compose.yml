services:
  lb:
    image: nginx:alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 10M

  api1:
    image: nathanfabio/fraud-detector2:latest
    environment:
      - VECTOR_SEARCH_URL=http://vector-search:8080
    depends_on:
      vector-search:
        condition: service_healthy
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 50M
    restart: unless-stopped

  api2:
    image: nathanfabio/fraud-detector2:latest
    environment:
      - VECTOR_SEARCH_URL=http://vector-search:8080
    depends_on:
      vector-search:
        condition: service_healthy
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 50M
    restart: unless-stopped

  vector-search:
    image: nathanfabio/vector-search:latest
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 2s
      timeout: 1s
      retries: 5
      start_period: 10s
    networks:
      - fraud-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 230M 
    restart: unless-stopped

networks:
  fraud-net:
    driver: bridge