services:
  lb:
    image: nathanfabio/fraud-detector4:v8
    command: ["./lb"]
    ports:
      - "9999:80"
    volumes:
      - sock-vol:/run/sock
    depends_on:
      - api1
      - api2
    networks:
      - app-net
    mem_limit: 8m
    cpus: "0.05"

  api1:
    image: nathanfabio/fraud-detector4:v8
    command: ["./server"]
    hostname: api1
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
    volumes:
      - sock-vol:/run/sock
    networks:
      - app-net
    mem_limit: 171m
    cpus: "0.475"

  api2:
    image: nathanfabio/fraud-detector4:v8
    command: ["./server"]
    hostname: api2
    environment:
      - PORT=8080
      - GOMEMLIMIT=150MiB
    volumes:
      - sock-vol:/run/sock
    networks:
      - app-net
    mem_limit: 171m
    cpus: "0.475"

networks:
  app-net:
    driver: bridge

volumes:
  sock-vol:
