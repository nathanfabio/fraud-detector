cat > haproxy.cfg << 'EOF'
global
    log stdout format raw local0
    maxconn 4096
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http_front
    bind *:8080
    default_backend app_servers

backend app_servers
    balance roundrobin
    option tcp-check
    server app1 app1:9999 check inter 3s fall 2 rise 2
    server app2 app2:9999 check inter 3s fall 2 rise 2
EOF