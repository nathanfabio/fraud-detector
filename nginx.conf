events {
    worker_connections 4096;
}

http {
    upstream backend {
        server unix:/run/sock/api1.sock;
        server unix:/run/sock/api2.sock;
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
