events {
    worker_connections 4096;
}

http {
    upstream backend {
        server api1:8080 max_fails=0;
        server api2:8080 max_fails=0;
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
