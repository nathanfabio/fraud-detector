events {
    worker_connections 1024;
}

http {
    upstream fraud_api {
        server api-1:8080;
        server api-2:8080;
        keepalive 32;
    }

    server {
        listen 9999;

        location / {
            proxy_pass            http://fraud_api;
            proxy_http_version    1.1;
            proxy_set_header      Connection "";
            proxy_set_header      Host $host;

            proxy_connect_timeout 500ms;
            proxy_send_timeout    500ms;
            proxy_read_timeout    500ms;
        }
    }
}